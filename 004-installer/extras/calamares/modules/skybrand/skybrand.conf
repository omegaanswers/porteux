# SkyCAIR OS — skybrand Calamares Module Config
# © 2018–2026 2XR, LLC | SkySTACK™ | 123Tech.net
---
# Path to custom skybrand.conf on boot media (loaded by SkyLEGO parameter)
# Override: skybrand=/path/to/skybrand.conf
SkyLEGO parameter_conf_path: "/skycair/skybrand.conf"

# Show brand personalization UI page during install?
# Set to false for silent/OEM installs (uses skybrand.conf values only)
show_ui_page: true

# Fields shown in the UI page
ui_fields:
  - company_name
  - domain
  - email
  - phone
  - local_domain
  - host_ip
  - timezone
  - system_user
  - license_tier
  - tagline
