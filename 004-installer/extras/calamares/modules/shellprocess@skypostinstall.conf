# SkyCAIR OS — Post-Install Tasks
# Runs inside chroot of installed system after all packages are deployed
# Handles: dracut rebuild, overlayfs config, SkyAPI UUID write, first-boot setup
---
dontChroot: false
timeout:    180

script:
  # ── 0. Source hardware env bridge (written by skyhardware Calamares module) ──
  # This gives us SKYCAIR_NVME_SWAP_DEVICE, SKYCAIR_NVME_SWAP_TIER, etc.
  - "[ -f /run/calamares-skyenv.sh ] && . /run/calamares-skyenv.sh || true"

  # ── 1. Write SkyAPI device UUID ──────────────────────────────────────────
  - "mkdir -p /etc/skycair"
  - "echo \"$SKYCAIR_UUID\" > /etc/skycair/device-uuid"
  - "chmod 600 /etc/skycair/device-uuid"

  # ── 2. Write SkyOMEGAi config ────────────────────────────────────────────
  - "[ -f /etc/skycair/skyomegai.conf ] && sed -i \"s/^ACCELERATOR=.*/ACCELERATOR=$SKYCAIR_ACCELERATOR/\" /etc/skycair/skyomegai.conf || true"

  # ── 3. Rebuild initramfs with dracut ─────────────────────────────────────
  - "dracut --force --add-drivers 'squashfs overlay' /boot/initrd-$(uname -r).img $(uname -r)"

  # ── 4. Configure overlayfs for .xzm modules ──────────────────────────────
  # Create the SkyMod overlay mount point directory
  - "mkdir -p /run/skymod-base /run/skymod-upper /run/skymod-work"
  # Ensure /skycair directory exists for .xzm modules
  - "mkdir -p /skycair"

  # ── 5. Enable SkyCAIR services ───────────────────────────────────────────
  - "chmod +x /etc/rc.d/rc.networkmanager || true"
  - "chmod +x /etc/rc.d/rc.ollama || true"
  - "chmod +x /etc/rc.d/rc.open-webui || true"

  # ── 6. SkyAPI first-boot registration (if offline during install) ─────────
  - |
    cat > /etc/rc.d/rc.skycair-firstboot << 'FIRSTBOOT'
    #!/bin/bash
    # SkyCAIR first-boot: register UUID with SkyAPI if not done during install
    UUID_FILE=/etc/skycair/device-uuid
    REGISTERED_FILE=/etc/skycair/.skyapi-registered

    if [ -f "$UUID_FILE" ] && [ ! -f "$REGISTERED_FILE" ]; then
        UUID=$(cat "$UUID_FILE")
        curl -sf --max-time 10 \
            -X POST https://skyapi.123tech.net/api/v1/register \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$UUID\",\"os\":\"SkyCAIR-EODv9\"}" \
        && touch "$REGISTERED_FILE"
    fi

    # Disable this script after first run
    chmod -x /etc/rc.d/rc.skycair-firstboot
    FIRSTBOOT
    chmod +x /etc/rc.d/rc.skycair-firstboot

  # ── 7. NVMe PCIe Swap — auto-enable based on tier ────────────────────────
  # SKYCAIR_NVME_SWAP_DEVICE and SKYCAIR_NVME_SWAP_TIER are set by
  # skyhardware module via /run/calamares-skyenv.sh (sourced in step 0).
  #
  # Tier classification:
  #   allowed     = PCIe 3.0 — standard NVMe swap, lower priority
  #   preferred   = PCIe 4.0 x4+ — RAM-like speeds, high priority AI offload
  #   recommended = PCIe 5.0 — super speed (Xeon W / Ryzen 7000+ / AI training)
  - |
    NVME_SWAP_DEV="${SKYCAIR_NVME_SWAP_DEVICE:-}"
    NVME_SWAP_TIER="${SKYCAIR_NVME_SWAP_TIER:-none}"
    NVME_PCIE_GEN="${SKYCAIR_NVME_PCIE_GEN:-0}"
    NVME_PCIE_LANES="${SKYCAIR_NVME_PCIE_LANES:-0}"

    if [ -n "$NVME_SWAP_DEV" ] && [ -b "$NVME_SWAP_DEV" ] && [ "$NVME_SWAP_TIER" != "none" ]; then
        echo "Auto-enabling NVMe swap: ${NVME_SWAP_DEV} (PCIe ${NVME_PCIE_GEN}.0 x${NVME_PCIE_LANES} — tier: ${NVME_SWAP_TIER})"

        # Set swap priority based on tier
        # allowed=50 (standard), preferred=80 (high), recommended=100 (max)
        case "$NVME_SWAP_TIER" in
            recommended) SWAP_PRI=100 ; SWAPPINESS=3  ;;  # PCIe 5.0 — max priority
            preferred)   SWAP_PRI=80  ; SWAPPINESS=5  ;;  # PCIe 4.0 — high priority
            allowed)     SWAP_PRI=50  ; SWAPPINESS=10 ;;  # PCIe 3.0 — standard
            *)           SWAP_PRI=10  ; SWAPPINESS=20 ;;
        esac

        mkswap "$NVME_SWAP_DEV" && swapon -p "$SWAP_PRI" "$NVME_SWAP_DEV" || true

        # Add to /etc/fstab for persistent swap with correct priority
        echo "${NVME_SWAP_DEV}  none  swap  sw,pri=${SWAP_PRI}  0  0" >> /etc/fstab

        # Update nvme-swap.conf
        if [ -f /etc/skycair/nvme-swap.conf ]; then
            sed -i "s|NVME_SWAP_PARTITION=.*|NVME_SWAP_PARTITION=${NVME_SWAP_DEV}|" \
                /etc/skycair/nvme-swap.conf
            sed -i "s|NVME_SWAP_ENABLED=.*|NVME_SWAP_ENABLED=yes|" \
                /etc/skycair/nvme-swap.conf
            sed -i "s|NVME_SWAP_TIER=.*|NVME_SWAP_TIER=${NVME_SWAP_TIER}|" \
                /etc/skycair/nvme-swap.conf
        fi

        # Tune vm.swappiness for AI workloads (keep hot data in RAM, offload cold)
        echo "vm.swappiness=${SWAPPINESS}" >> /etc/sysctl.d/99-skycair-nvme-swap.conf
        echo "vm.vfs_cache_pressure=50" >> /etc/sysctl.d/99-skycair-nvme-swap.conf

        chmod +x /etc/rc.d/rc.skycair-nvme-swap 2>/dev/null || true

        echo "NVMe swap active: ${NVME_SWAP_DEV} tier=${NVME_SWAP_TIER} pri=${SWAP_PRI} swappiness=${SWAPPINESS}"
    else
        echo "No suitable NVMe swap device — skipping NVMe swap configuration"
    fi

  # ── 7c. Background AI task throttling — protect foreground UX ────────────
  # AI background daemons (Ollama, Open WebUI) run at lower resource priority.
  # If the desktop/user tasks become sluggish, the kernel and cgroup weights
  # automatically shift resources to foreground user experience.
  - |
    # Kernel: enable autogroup scheduling (boosts foreground terminal/desktop vs daemons)
    echo "kernel.sched_autogroup_enabled=1" >> /etc/sysctl.d/99-skycair-scheduler.conf
    # Reduce latency penalty for context switches (better desktop responsiveness)
    echo "kernel.sched_migration_cost_ns=5000000" >> /etc/sysctl.d/99-skycair-scheduler.conf
    # Keep hot filesystem cache, but let AI model data swap out first
    echo "vm.vfs_cache_pressure=50" >> /etc/sysctl.d/99-skycair-scheduler.conf

    # Configure Ollama service with lower CPU/IO weight via rc.d wrapper
    # CPUWeight=200 = half of normal (1024), IOWeight=100 = lowest I/O tier
    OLLAMA_RC=/etc/rc.d/rc.ollama
    if [ -f "$OLLAMA_RC" ]; then
        # Prepend ionice + nice to the ollama launch line
        sed -i 's|^.*ollama serve.*$|ionice -c 3 nice -n 10 ollama serve|' "$OLLAMA_RC" 2>/dev/null || true
    fi

    # Write a cgroup v2 resource config for AI services (applies at boot)
    mkdir -p /etc/skycair
    cat > /etc/skycair/ai-resource-limits.conf << 'AIRLIMITS'
# SkyCAIR AI background task resource limits
# These values protect foreground desktop/user experience.
# kernel.sched_autogroup_enabled handles per-session priority automatically.
OLLAMA_CPU_WEIGHT=200        # 200/1024 = ~20% CPU share when contested
OLLAMA_IO_WEIGHT=100         # Lowest I/O priority tier
OLLAMA_NICE=10               # nice level (lower priority than default 0)
WEBUI_CPU_WEIGHT=256         # Open WebUI: slightly higher for UI responsiveness
# Auto-throttle: if loadavg > CPU_COUNT * 1.5, reduce Ollama to 100 weight
AUTO_THROTTLE_ENABLED=yes
AUTO_THROTTLE_THRESHOLD=1.5
AIRLIMITS

    echo "AI background throttling configured — foreground UX protected"

  # ── 7b. Set packages.123tech.net as primary package repo ─────────────────
  - |
    if [ -f /builder-utils/setflags.sh ]; then
        echo "SkyRepo configured in setflags.sh"
    fi

  # ── 8. Set GRUB timeout and entry name ───────────────────────────────────
  - "sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=5/' /etc/default/grub || true"
  - "sed -i 's/GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR=\"SkyCAIR OS\"/' /etc/default/grub || true"
  - "grub-mkconfig -o /boot/grub/grub.cfg || true"

  # ── 9. Remove live-only hooks ─────────────────────────────────────────────
  - "rm -f /etc/rc.d/rc.skycair-live || true"

  # ── 10. Final cleanup ─────────────────────────────────────────────────────
  - "rm -rf /tmp/calamares-* || true"
  - "sync"

  - "echo '✅ SkyCAIR OS post-install complete'"
