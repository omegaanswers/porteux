# Calamares unpackfs — copy SkyCAIR live system to disk
# SkyCAIR OS uses .xzm (squashfs) modules stacked via overlayfs
# We rsync the fully-merged overlayfs root to the target partition
---
unpack:
  - source: "/"
    sourcefs: "ext4"
    destination: ""
    exclude:
      - "/proc"
      - "/sys"
      - "/dev"
      - "/run"
      - "/tmp"
      - "/mnt"
      - "/media"
      - "/live"
      - "/skycair"
      - "lost+found"
