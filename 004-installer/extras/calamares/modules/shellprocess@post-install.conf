# SkyCAIR post-install shell tasks
---
dontChroot: false
timeout: 120

script:
  # Remove live-only service and ramdisk configs
  - "-/usr/sbin/rc-service skycair-live stop"
  - "rm -f /etc/rc.d/rc.skycair-live"
  - "rm -f /etc/rc.d/rc.skycair-live.conf"

  # Rebuild initrd for installed system
  - "dracut --force /boot/initrd-$(uname -r).img $(uname -r)"

  # Enable NetworkManager on installed system
  - "chmod +x /etc/rc.d/rc.networkmanager"

  # Set hostname from installer user input
  - "echo skycair > /etc/hostname"

  # Remove live squashfs/xzm boot references from installed grub
  - "sed -i '/skycair.xzm/d' /boot/grub/grub.cfg"

  # Apply SkyCAIR sysctl optimizations
  - "sysctl -p /etc/sysctl.d/99-skycair.conf"

  # Final cleanup
  - "rm -rf /tmp/calamares-*"
