# SkyCAIR OS — SkySTACK Calamares Installer Settings
# Enterprise server + desktop OS — one codebase
# 2XR, LLC | Evolve2Linux | 123Tech.net | SkyCAIR@123Tech.net
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:      skyapi
    module:  skyapi
    config:  skyapi.conf
  - id:      skyhardware
    module:  skyhardware
    config:  skyhardware.conf
  - id:      skymodules
    module:  skymodules
    config:  skymodules.conf
  - id:      skypostinstall
    module:  shellprocess@skypostinstall
    config:  shellprocess@skypostinstall.conf

sequence:
  - show:
    - welcome           # Language, timezone, EULA
    - locale
    - keyboard
    - skyhardware       # Hardware detection → tier recommendation
    - skyapi            # SkyAPI account + UUID registration
    - skymodules        # .xzm module selection per tier
    - partition         # Disk + NVMe/PCIe5 optimization
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader-config
    - grubcfg
    - bootloader
    - skypostinstall     # dracut rebuild, overlayfs, SkyMod deploy, first-boot
    - preservefiles
    - umount
  - show:
    - finished

branding: skycair

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
