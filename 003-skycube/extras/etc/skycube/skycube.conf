# Default storage pool path (backed by SkyVAULT ZFS when 050-skyvault activated)
SKYCUBE_POOL_PATH="/skycair/cubes"

# Default VM resources
SKYCUBE_DEFAULT_CPU=2
SKYCUBE_DEFAULT_RAM=2048   # MB
SKYCUBE_DEFAULT_DISK=20    # GB

# VDI frontend: gnome-boxes (desktop GUI) or cockpit (browser SPICE tab)
SKYCUBE_VDI_BACKEND="gnome-boxes"

# SPICE display port (for virt-viewer / remote access)
SKYCUBE_SPICE_PORT=5900

# Cockpit-Machines web UI port (if cockpit + cockpit-machines installed)
SKYCUBE_COCKPIT_PORT=9090

# libvirt connection URI (session = rootless, system = root/privileged)
SKYCUBE_LIBVIRT_URI="qemu:///session"

# Network: skycube-nat (192.168.122.0/24 NAT bridge, virbr0)
SKYCUBE_DEFAULT_NETWORK="skycube-nat"
