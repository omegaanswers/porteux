# SkyCAIR OS — SkyOMEGAi Configuration
# Private AI — Care About AI Readiness
# 2XR, LLC | 123Tech.net | SkyCAIR@123Tech.net
#
# Edit this file to configure which AI engine(s) SkyOMEGAi uses.
# Changes take effect on next boot or: rc.ollama restart

# ── AI ENGINE ────────────────────────────────────────────────────────────────
# engine=ollama   → Local inference only (offline, private, your hardware)
# engine=claude   → Anthropic Claude API only (internet required, API key required)
# engine=both     → Ollama local + Claude cloud — both visible in Open WebUI
ENGINE=ollama

# ── HARDWARE ACCELERATOR ─────────────────────────────────────────────────────
# Set automatically by accelerator sub-module overlay at boot.
# Do not edit unless overriding manually.
# Values: cpu | cuda | rocm | rknn
ACCELERATOR=cpu

# ── CLAUDE API ───────────────────────────────────────────────────────────────
# Required only when ENGINE=claude or ENGINE=both
# Get your key at: https://console.anthropic.com
# NEVER share this key or commit it to version control.
ANTHROPIC_API_KEY=

# Claude model to use in Open WebUI
# Options: claude-opus-4-6 | claude-sonnet-4-6 | claude-haiku-4-5-20251001
CLAUDE_MODEL=claude-sonnet-4-6

# ── OLLAMA SETTINGS ───────────────────────────────────────────────────────────
# Default model to load at boot (blank = don't preload)
# Examples: llama3.2:3b  phi3:mini  qwen2.5:3b  mistral:7b
OLLAMA_DEFAULT_MODEL=llama3.2:3b

# Autostart Ollama at boot (0=no, 1=yes)
OLLAMA_AUTOSTART=1

# Autostart Open WebUI at boot (0=no, 1=yes)
WEBUI_AUTOSTART=1

# Open WebUI port
WEBUI_PORT=3001

# ── PRIVACY ───────────────────────────────────────────────────────────────────
# Ollama is fully local and offline — models never leave your device.
# Claude API sends prompts to Anthropic servers (requires internet).
# For air-gap / offline use: ENGINE=ollama only.
