# SkyCAIR OS — NVIDIA CUDA kernel module parameters
# Loaded by 003-skyomegai-nvidia.xzm

# Enable persistent mode for CUDA (faster model loading, avoids GPU init delay)
options nvidia NVreg_RegistryDwords="PerfLevelSrc=0x2222"

# Unified memory for large models that exceed VRAM
options nvidia NVreg_EnableGpuFirmware=0

# Disable power management interference during inference
options nvidia_drm modeset=1
