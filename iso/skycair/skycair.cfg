##
## SKYTIMEMACHINE — Snapshot Backup & Restore
##
## SkyTimeMachine creates daily snapshots of your SkyFILES partition and
## provides GRUB boot menu entries to roll back to any saved snapshot.
##
## Snapshot retention: 3 days (3 daily snapshots kept automatically)
## Snapshot location:  /skycair/snapshots/ on the SkyFILES partition
## Factory default:    original read-only PorteuX base (always available)
##
## GRUB Boot Menu Entries:
##   "SkyCAIR — Roll Back to Factory Defaults"
##     Boots with no changes= (RAM-only, clean PorteuX base)
##     Use this to recover from a corrupted SkyFILES save layer.
##
##   "SkyCAIR — Restore SkyBackup (Day 1/2/3)"
##     Boots using a snapshot copy of your SkyFILES save layer.
##     You have 3 days to resurrect from any of the 3 daily snapshots.
##
## To configure SkyTimeMachine:
##   sh /boot/skycair-scripts/skytimemachine-setup.sh
##   (Sets up daily snapshot cron + GRUB menu entries)
##
## To manually create a snapshot now:
##   sh /boot/skycair-scripts/skytimemachine-snapshot.sh
##
## Snapshot storage requirements:
##   Each snapshot ≈ size of your SkyFILES changes (compressed btrfs snapshot
##   or rsync delta — typically 10–30% of total save layer size)
##
## Recommended: Use btrfs for SkyFILES partition (native snapshots, ~0 overhead)
##   mkfs.btrfs -L SkyFILES /dev/sdb1
##   Then: changes=LABEL:SkyFILES:/skycair
##
#skytimemachine=enable     # Enable automatic daily snapshots (3-day retention)
#skytimemachine=btrfs      # Use btrfs native snapshots (fastest, recommended)
#skytimemachine=rsync      # Use rsync incremental backup (works on ext4/any FS)


