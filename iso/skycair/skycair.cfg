##
## SkyFILES — Persistent User Data (Read/Write Save Layer)
##
## SkyFILES is your personal persistent storage — the read/write overlay that
## sits on top of SkyCAIR's read-only base (PorteuX root). Think of it as your
## personal 16GB+ partition where all your settings, files, and installed apps
## are permanently saved across reboots.
##
## Without SkyFILES: SkyCAIR runs in live (RAM) mode — changes lost on reboot.
## With SkyFILES:    All changes persist — your desktop, files, and apps are saved.
##
## SkyFILES can be:
##   1. A file on the boot media (skycair-save.dat — limited by free space)
##   2. A dedicated partition (recommended — 16GB+ ext4 or btrfs)
##   3. A labeled partition for multi-drive setups
##
## To create SkyFILES (16GB save file):
##   sh /boot/skycair-scripts/create-save-data.sh
##   (creates /skycair/skycair-save.dat on your boot media)
##
## To use a dedicated partition for SkyFILES (recommended for 16GB+):
##   Format a partition as ext4 and label it "SkyFILES"
##   mkfs.ext4 -L SkyFILES /dev/sdb1
##   Then use: changes=LABEL:SkyFILES:/skycair
##
## The "Persistent 16GB" entry in the boot menu auto-uses skycair-save.dat.
##
## ── Uncomment ONE of the following: ──────────────────────────────────────────

## Option 1: Save file on boot media (convenient, limited size)
#changes=/skycair/skycair-save.dat

## Option 2: Dedicated partition (recommended — 16GB+ separate partition)
##   Use EXIT: to save on unmount (prevents corruption on hard power-off)
#changes=EXIT:/skycair

## Option 3: Labeled partition (easiest for multi-drive or removable media)
#changes=LABEL:SkyFILES:/skycair

## Option 4: Custom save file on a specific labeled partition
#changes=LABEL:MyDrive/skycair/skycair-save.dat


##
## SYSTEM
##
## Auto login as guest (default behavior -- no change needed)
#login=guest

## Auto login as root
#login=root

## Set your timezone (find yours in /usr/share/zoneinfo/)
timezone=America/Chicago
#timezone=America/New_York
#timezone=America/Los_Angeles
#timezone=Europe/London
#timezone=Europe/Berlin
#timezone=Asia/Tokyo

## Set keyboard layout
kmap=us
#kmap=us:alt-intl
#kmap=gb
#kmap=de
#kmap=fr


##
## AUDIO
##
## Set master volume at boot (0-100)
#volume=75


##
## PERFORMANCE
##
## Enable zRAM compressed swap (good for systems with less than 4 GB RAM)
#zram=33%

## Load all modules into RAM at boot (requires 2 GB+ RAM, fastest mode)
#copy2ram


##
## DISPLAY
##
## Disable GPU kernel mode setting (use if display fails to start)
#nomodeset


##
## NETWORKING
##
## Disable automatic network connection at boot
#nonetwork

## Disable Bluetooth daemon at boot
#nobluetooth

## DNS resolver selection (default: DHCP-provided DNS)
## dns=cloudflare   → 1.1.1.1 / 1.0.0.1     (Cloudflare, privacy-focused)
## dns=quad9        → 9.9.9.9 / 149.112.112.112  (Quad9, malware-blocking)
## dns=google       → 8.8.8.8 / 8.8.4.4      (Google Public DNS)
## dns=local        → 127.0.0.53              (systemd-resolved, local resolver)
## dns=opennic      → OpenNIC alternative root (censorship-resistant)
#dns=cloudflare
#dns=quad9
#dns=local


##
## HARDWARE
##
## Add a delay before mounting (use if boot hangs on slow USB, value in seconds)
#delay=5

## Disable swap partition auto-detection
#noswap

## Rockchip RK3588 / RK3588S — NPU + AI acceleration
## Enables RKNN NPU driver and loads rknn-toolkit2 PyTorch backend at boot.
## Supported boards: Orange Pi 5 Plus, Rock 5B, ArmSoM RK3588, Radxa ROCK5
#rknn=enable

## Enable PCIe 5.0 NVMe swap tier (requires SkySTACK-E2L or SkyGRID-E2L)
#nvmeswap=enable


##
## BOOT MODE
##
## Boot into text mode (no desktop)
#3

## Load optional modules by name pattern
#load=nvidia;devel

## Skip loading modules by name pattern
#noload=multilanguage


##
## AI — Private Local AI (SkyCAIR Care About AI Readiness)
##
## ai=local    → Start Ollama LLM inference server at boot (offgrid, no internet)
##               Models stored in /skycair/ai/models/ — pulled on first use
##               Recommended models (small, run on 4GB+ RAM):
##                 llama3.2:3b   → fast general assistant (2.0GB)
##                 phi3:mini     → Microsoft Phi-3 mini (2.3GB)
##                 qwen2.5:3b    → Qwen2.5 general (1.9GB)
##                 mistral:7b    → Mistral 7B (4.1GB, needs 8GB+ RAM)
##               To pull a model after boot:
##                 ollama pull llama3.2:3b
##               To chat from CLI:
##                 ollama run llama3.2:3b
##                 skyair ai chat
#ai=local

## ai=webui    → Also start Open WebUI (browser interface at http://localhost:3001)
##               Requires ai=local. Provides Claude-like chat UI for local models.
#ai=webui

## ai=rknn     → Use Rockchip NPU for AI inference (requires rknn=enable above)
##               Enables RKNN backend in Ollama for hardware-accelerated inference
##               on RK3588 NPU (~6 TOPS). Best for llama3.2:3b / phi3:mini.
#ai=rknn

## ai=knowledge → Start offline knowledge base (Kiwix) at boot
##               Serves Wikipedia, Wikibooks, Encyclopedia, Bible, engineering docs
##               Access at http://localhost:8888 after boot
##               .zim files must be in /skycair/knowledge/zim/ or /opt/skycair/knowledge/zim/
##               Download .zim files: https://download.kiwix.org/zim/
#ai=knowledge

## ai=full     → Start complete AI stack: Ollama + Open WebUI + Kiwix + ChromaDB
##               Requires 16GB+ RAM for comfortable operation with 7B models
#ai=full


