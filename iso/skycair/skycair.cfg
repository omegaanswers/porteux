### SkyCAIR v2.6 -- Persistent Configuration File
### 2XR, LLC | Evolve2Linux | 123Tech.net
###
### Do not remove this file, otherwise the system will fail to boot.
### You may place most cheatcodes here, one per line.
### Cheatcodes must begin at the start of the line (no leading space).
### Any line starting with "#" will be ignored.
###
### ATTENTION: the following cheatcodes are ignored when placed here
### (they affect how SkyCAIR detects and mounts storage media):
### 'cfgfile=', 'delay=', 'from=', 'mopt=', 'fsck'.
###
### Full cheatcodes reference: /boot/docs/cheatcodes.txt
### Installation guide:        /boot/docs/install.txt


##
## SAVE DATA
## Uncomment ONE of the following to set your default save location.
## The "Persistent 16GB" boot menu entry uses skycair-save.dat.
## To create the save file: sh /boot/skycair-scripts/create-save-data.sh
##
#changes=/skycair/skycair-save.dat
#changes=EXIT:/skycair

## Use a save file on a specific labeled partition
#changes=LABEL:MyDrive/skycair/skycair-save.dat


##
## SYSTEM
##
## Auto login as guest (default behavior -- no change needed)
#login=guest

## Auto login as root
#login=root

## Set your timezone (find yours in /usr/share/zoneinfo/)
timezone=America/Chicago
#timezone=America/New_York
#timezone=America/Los_Angeles
#timezone=Europe/London
#timezone=Europe/Berlin
#timezone=Asia/Tokyo

## Set keyboard layout
kmap=us
#kmap=us:alt-intl
#kmap=gb
#kmap=de
#kmap=fr


##
## AUDIO
##
## Set master volume at boot (0-100)
#volume=75


##
## PERFORMANCE
##
## Enable zRAM compressed swap (good for systems with less than 4 GB RAM)
#zram=33%

## Load all modules into RAM at boot (requires 2 GB+ RAM, fastest mode)
#copy2ram


##
## DISPLAY
##
## Disable GPU kernel mode setting (use if display fails to start)
#nomodeset


##
## NETWORKING
##
## Disable automatic network connection at boot
#nonetwork

## Disable Bluetooth daemon at boot
#nobluetooth


##
## HARDWARE
##
## Add a delay before mounting (use if boot hangs on slow USB, value in seconds)
#delay=5

## Disable swap partition auto-detection
#noswap


##
## BOOT MODE
##
## Boot into text mode (no desktop)
#3

## Load optional modules by name pattern
#load=nvidia;devel

## Skip loading modules by name pattern
#noload=multilanguage


##
## ADVANCED
##
## Load SkyCAIR modules from an extra folder
#extramod=/mnt/sdb3/extra-modules

## Copy files from a custom rootcopy directory
#rootcopy=/mnt/sda5/my-rootcopy

## Run a command after desktop loads (example: open browser)
#guiexec=firefox
