## DNS resolver selection (default: DHCP-provided DNS)
## dns=cloudflare   → 1.1.1.1 / 1.0.0.1     (Cloudflare, privacy-focused)
## dns=quad9        → 9.9.9.9 / 149.112.112.112  (Quad9, malware-blocking)
## dns=google       → 8.8.8.8 / 8.8.4.4      (Google Public DNS)
## dns=local        → 127.0.0.53              (systemd-resolved, local resolver)
## dns=opennic      → OpenNIC alternative root (censorship-resistant)
#dns=cloudflare
#dns=quad9
#dns=local


