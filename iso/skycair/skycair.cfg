##
## SKYLEGO — Boot Parameters (SkyCAIR OS Configuration)
##
## SkyLEGO parameters fine-tune how SkyCAIR OS boots, configures itself,
## and connects to your SkySTACK ecosystem. Think of them as LEGO bricks —
## snap them together to build exactly the system you need.
##
## All parameters below are commented (#) by default.
## Uncomment any line to activate that parameter.
## Reference: /boot/docs/skylego.txt
##
## Quick combos:
##   ── Workstation: timezone=<tz>  kmap=us  changes=LABEL:SkyFILES:/skycair
##   ── AI Node:     ai=full  changes=LABEL:SkyFILES:/skycair  copy2ram
##   ── Server:      3  nonetwork=wifi  skybrand=/skycair/skybrand.conf
##   ── Education:   ai=knowledge  skybrand=/skycair/skybrand.conf  guiexec=firefox http://localhost:8888


##
## SKYBRAND PERSONALIZATION — skybrand_personalization™
##
## skybrand_personalization™ is a licensable white-label feature.
## Configure your company/organization branding at boot or install time.
## Resellers, schools, and enterprise customers use this to deploy
## a fully-branded SkySTACK without touching any source files.
##
## Option 1: Point to a skybrand.conf file on boot media (recommended)
##   Place your skybrand.conf in /skycair/ on the boot USB
##   SkyCAIR reads it at boot and applies all brand variables
#skybrand=/skycair/skybrand.conf

## Option 2: Inline key-value overrides (quick single-value changes)
#skybrand_company=MyCompany
#skybrand_domain=mycompany.local
#skybrand_email=admin@mycompany.com
#skybrand_phone=555-1234
#skybrand_user=admin
#skybrand_localdom=mycompany.local
#skybrand_hostip=192.168.10.50
#skybrand_timezone=America/New_York
#skybrand_tier=SkyGRID-E2L
#skybrand_tagline=Powered by MyCompany

## Option 3: Calamares installer integration
##   When booting the installer ISO, skybrand is shown as a UI page.
##   Values entered there override this file.


