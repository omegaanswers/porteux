##
## SkyFILES — Persistent User Data (Read/Write Save Layer)
##
## SkyFILES is your personal persistent storage — the read/write overlay that
## sits on top of SkyCAIR's read-only base (PorteuX root). Think of it as your
## personal 16GB+ partition where all your settings, files, and installed apps
## are permanently saved across reboots.
##
## Without SkyFILES: SkyCAIR runs in live (RAM) mode — changes lost on reboot.
## With SkyFILES:    All changes persist — your desktop, files, and apps are saved.
##
## SkyFILES can be:
##   1. A file on the boot media (skycair-save.dat — limited by free space)
##   2. A dedicated partition (recommended — 16GB+ ext4 or btrfs)
##   3. A labeled partition for multi-drive setups
##
## To create SkyFILES (16GB save file):
##   sh /boot/skycair-scripts/create-save-data.sh
##   (creates /skycair/skycair-save.dat on your boot media)
##
## To use a dedicated partition for SkyFILES (recommended for 16GB+):
##   Format a partition as ext4 and label it "SkyFILES"
##   mkfs.ext4 -L SkyFILES /dev/sdb1
##   Then use: changes=LABEL:SkyFILES:/skycair
##
## The "Persistent 16GB" entry in the boot menu auto-uses skycair-save.dat.
##
## ── Uncomment ONE of the following: ──────────────────────────────────────────

## Option 1: Save file on boot media (convenient, limited size)
#changes=/skycair/skycair-save.dat

## Option 2: Dedicated partition (recommended — 16GB+ separate partition)
##   Use EXIT: to save on unmount (prevents corruption on hard power-off)
#changes=EXIT:/skycair

## Option 3: Labeled partition (easiest for multi-drive or removable media)
#changes=LABEL:SkyFILES:/skycair

## Option 4: Custom save file on a specific labeled partition
#changes=LABEL:MyDrive/skycair/skycair-save.dat


