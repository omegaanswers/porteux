# SkyCAIR OS — GRUB2 Boot Menu
# One CodeBase: Desktop | Server | Enterprise
# 2XR, LLC | Evolve2Linux | 123Tech.net | SkyCAIR@123Tech.net
#
# BIOS: syslinux/isolinux (see iso/boot/syslinux/skycair.cfg)
# UEFI: GRUB2 (this file)

set default=0
set timeout=5
set timeout_style=menu

# Theme
if [ -f /boot/grub/skycair-theme/theme.txt ]; then
    set theme=/boot/grub/skycair-theme/theme.txt
fi

# Common kernel args
set COMMON="kvm.enable_virt_at_load=0 quiet"

# Locate SkyCAIR OS modules on the boot device
search --no-floppy --label --set=root SkyCAIR

# ─── Menu Entries ──────────────────────────────────────────────────────────────

menuentry "SkyCAIR OS  —  Desktop (COSMIC)" --class skycair --class gnu-linux {
    linux  /boot/syslinux/vmlinuz changes=EXIT:/skycair ${COMMON}
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Server (Headless / Enterprise)" --class skycair --class gnu-linux {
    linux  /boot/syslinux/vmlinuz changes=EXIT:/skycair ${COMMON} 3
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Install to Hard Drive (Desktop + COSMIC)" --class installer {
    linux  /boot/syslinux/vmlinuz changes=EXIT:/skycair ${COMMON} guiexec=calamares
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Install as Server (Headless)" --class installer {
    linux  /boot/syslinux/vmlinuz changes=EXIT:/skycair ${COMMON} 3 guiexec=sh /opt/skycair-scripts/calamares-server.sh
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Persistent Mode (16GB Save File)" --class skycair {
    linux  /boot/syslinux/vmlinuz changes=/skycair/skycair-save.dat ${COMMON}
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Copy to RAM (Fastest — 2GB+ RAM Required)" --class skycair {
    linux  /boot/syslinux/vmlinuz copy2ram ${COMMON}
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Always Fresh (No Changes Saved)" --class skycair {
    linux  /boot/syslinux/vmlinuz baseonly norootcopy ${COMMON}
    initrd /boot/syslinux/initrd.zst
}

menuentry "SkyCAIR OS  —  Safe Mode (Basic Drivers / No KMS)" --class skycair {
    linux  /boot/syslinux/vmlinuz baseonly norootcopy nomodeset ${COMMON} 3
    initrd /boot/syslinux/initrd.zst
}

menuentry "Boot from First Hard Drive" --class hdd {
    set root=(hd0)
    chainloader +1
}
