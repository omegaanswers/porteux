UI vesamenu.c32

PROMPT 0
TIMEOUT 40

MENU RESOLUTION 1024 768
MENU CLEAR
MENU HIDDEN
MENU HIDDENKEY Enter graphical
MENU BACKGROUND /boot/syslinux/bootlogo.png

MENU WIDTH 129
MENU MARGIN 50
MENU ROWS 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HSHIFT 0
MENU VSHIFT 28

MENU COLOR BORDER  30;40      #00000000 #00000000 none
menu COLOR SEL     37;47      #FFFFFFFF #FF0096FF none
MENU COLOR UNSEL   37;40      #FFFFFFFF #FF000000 none
MENU COLOR TABMSG  32;40      #FF0096FF #FF000000 none

F1 /boot/syslinux/help.txt /boot/syslinux/black.png

MENU AUTOBOOT Press Esc for options, automatic boot in # second{,s}...
MENU TABMSG [F1] help                                                        [Tab] edit >

LABEL graphical
MENU LABEL SkyCAIR OS  (Desktop - COSMIC)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND changes=EXIT:/skycair kvm.enable_virt_at_load=0 quiet

LABEL server
MENU LABEL SkyCAIR OS  (Server - Headless, Enterprise)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND changes=EXIT:/skycair kvm.enable_virt_at_load=0 quiet 3

LABEL install-desktop
MENU LABEL Install to Hard Drive  (Desktop + COSMIC)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND changes=EXIT:/skycair kvm.enable_virt_at_load=0 quiet guiexec=calamares

LABEL install-server
MENU LABEL Install as Server  (Headless, No Desktop)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND changes=EXIT:/skycair kvm.enable_virt_at_load=0 quiet 3 guiexec=sh /opt/skycair-scripts/calamares-server.sh

LABEL persistent
MENU LABEL SkyCAIR OS  (Persistent - 16GB Save)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND changes=/skycair/skycair-save.dat kvm.enable_virt_at_load=0 quiet

LABEL copy2ram
MENU LABEL SkyCAIR OS  (Copy To RAM - Fastest)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND copy2ram kvm.enable_virt_at_load=0 quiet

LABEL fresh
MENU LABEL SkyCAIR OS  (Always Fresh - No Changes Saved)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND baseonly norootcopy kvm.enable_virt_at_load=0 quiet

LABEL safe
MENU LABEL SkyCAIR OS  (Safe Mode - Basic Drivers)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND baseonly norootcopy nomodeset kvm.enable_virt_at_load=0 3

LABEL text
MENU LABEL SkyCAIR OS  (Text Mode Only)
KERNEL /boot/syslinux/vmlinuz
INITRD /boot/syslinux/initrd.zst
APPEND 3 kvm.enable_virt_at_load=0
