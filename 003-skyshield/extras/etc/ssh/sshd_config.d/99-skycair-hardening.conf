# SkyCAIR OS — SkySHIELD-ATF SSH Hardening
# CIS Benchmark SSH controls / NIST SP 800-123 / HIPAA §164.312(d)
# Drop-in override for /etc/ssh/sshd_config
# 2XR, LLC | Evolve2Linux | 123Tech.net

# ── Access control ────────────────────────────────────────────────────────────
PermitRootLogin no                          # CIS 5.2.8 — root SSH disabled
PasswordAuthentication yes                  # Enabled; enforce key-only post-deploy
PubkeyAuthentication yes
PermitEmptyPasswords no                     # CIS 5.2.9
MaxAuthTries 3                              # CIS 5.2.7 — brute-force limit
MaxSessions 10
LoginGraceTime 30                           # 30s to complete auth (CIS 5.2.14)

# ── Protocol ──────────────────────────────────────────────────────────────────
Protocol 2                                  # SSHv2 only (CIS 5.2.2)

# FIPS 140-2 / NIST SP 800-131A key exchange (NSA Suite B + NIST curves)
KexAlgorithms \
    curve25519-sha256,\
    curve25519-sha256@libssh.org,\
    diffie-hellman-group16-sha512,\
    diffie-hellman-group18-sha512,\
    ecdh-sha2-nistp521,\
    ecdh-sha2-nistp384

# AES-256 and ChaCha20 symmetric ciphers only (CIS 5.2.13 / FIPS 197)
Ciphers \
    chacha20-poly1305@openssh.com,\
    aes256-gcm@openssh.com,\
    aes128-gcm@openssh.com,\
    aes256-ctr,\
    aes192-ctr,\
    aes128-ctr

# HMAC: ETM (Encrypt-then-MAC) SHA-2 only (CIS 5.2.14)
MACs \
    hmac-sha2-512-etm@openssh.com,\
    hmac-sha2-256-etm@openssh.com,\
    umac-128-etm@openssh.com

# Host keys: Ed25519 and ECDSA P-521 preferred
HostKeyAlgorithms \
    ssh-ed25519,\
    ecdsa-sha2-nistp521,\
    rsa-sha2-512,\
    rsa-sha2-256

# ── Feature restrictions ──────────────────────────────────────────────────────
X11Forwarding no                            # CIS 5.2.4
AllowAgentForwarding no
AllowTcpForwarding no                       # Enable per user in authorized_keys
PermitUserEnvironment no                    # CIS 5.2.10 — no env overrides
PrintMotd no                                # Custom MOTD via /etc/motd
Banner /etc/ssh/skycair-banner              # Legal notice (HIPAA / government)

# ── Logging (HIPAA §164.312(b) — audit trail) ─────────────────────────────────
SyslogFacility AUTHPRIV
LogLevel VERBOSE                            # CIS 5.2.3 — log all auth events

# ── Idle timeout (CIS 5.2.16) ─────────────────────────────────────────────────
ClientAliveInterval 300                     # Send keepalive every 5 minutes
ClientAliveCountMax 3                       # Disconnect after 15 minutes idle
