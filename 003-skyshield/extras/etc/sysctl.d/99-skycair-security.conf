# SkyCAIR OS — SkySHIELD-ATF Security Kernel Parameters
# CIS Benchmark / NIST SP 800-123 / HIPAA §164.312 / DISA STIG aligned
# Closed-loop system defaults — all forwarding off, hardened network stack
# 2XR, LLC | Evolve2Linux | 123Tech.net

# ── Closed-loop: no packet forwarding by default ─────────────────────────────
net.ipv4.ip_forward = 0                         # CIS 3.1.1
net.ipv6.conf.all.forwarding = 0
# Enable these in SkySHIELD-ATF router/VPN mode: set to 1

# ── IP spoofing protection (Reverse Path Filtering) ──────────────────────────
net.ipv4.conf.all.rp_filter = 1                 # CIS 3.2.7
net.ipv4.conf.default.rp_filter = 1

# ── Ignore ICMP broadcast (Smurf DDoS mitigation) ────────────────────────────
net.ipv4.icmp_echo_ignore_broadcasts = 1        # CIS 3.2.5
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── Reject ICMP redirects (prevents MITM route manipulation) ─────────────────
net.ipv4.conf.all.accept_redirects = 0          # CIS 3.2.2
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0            # CIS 3.1.2
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0

# ── Reject source-routed packets ─────────────────────────────────────────────
net.ipv4.conf.all.accept_source_route = 0       # CIS 3.2.1
net.ipv6.conf.all.accept_source_route = 0

# ── Log martian packets (spoofed/impossible source IPs) ──────────────────────
net.ipv4.conf.all.log_martians = 1              # CIS 3.2.4

# ── SYN flood protection ──────────────────────────────────────────────────────
net.ipv4.tcp_syncookies = 1                     # CIS 3.2.8
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_rfc1337 = 1                        # TIME_WAIT assassination protection

# ── Kernel information restriction ───────────────────────────────────────────
kernel.dmesg_restrict = 1                       # Restrict dmesg to root only
kernel.kptr_restrict = 2                        # Hide kernel pointers (/proc/kallsyms)
kernel.perf_event_paranoid = 3                  # perf: root only
kernel.unprivileged_bpf_disabled = 1            # No eBPF from unprivileged users
net.core.bpf_jit_harden = 2                    # Harden BPF JIT

# ── Memory protection (ASLR + hardlinks) ─────────────────────────────────────
kernel.randomize_va_space = 2                   # Full ASLR (CIS 1.6.2)
fs.suid_dumpable = 0                            # No core dumps for SUID binaries
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ── Autogroup scheduling (foreground user experience protection) ──────────────
# Background daemons (AI/Ollama) yield to foreground user sessions automatically
kernel.sched_autogroup_enabled = 1
