# SkyCAIR OS — Authoritative NTP Configuration
# SkySHIELD-ATF (Attack Threat Foundation)
# 2XR, LLC | Evolve2Linux | 123Tech.net | SkyCAIR@123Tech.net
# Timezone: America/Chicago (Central Time — Sauk City, WI)
#
# Primary authority: USNO (US Naval Observatory) — US military time standard
# Secondary: NIST Internet Time Service — Boulder, CO (US government)
# Fallback: US NTP pool

# ── US Naval Observatory (USNO) — Military Authoritative Time ────────────────
# USNO provides the authoritative time for all US military and government systems
# Stratum 1 — directly connected to atomic clocks
server tick.usno.navy.mil   iburst prefer     # USNO primary
server tock.usno.navy.mil   iburst            # USNO secondary
server ntp2.usno.navy.mil   iburst            # USNO tertiary

# ── NIST Internet Time Service — Boulder, Colorado ───────────────────────────
# NIST (National Institute of Standards and Technology) — US government standard
# Servers located at NIST labs in Boulder, CO (Mountain/Central region)
server time-a-g.nist.gov    iburst            # NIST General Purpose A
server time-b-g.nist.gov    iburst            # NIST General Purpose B
server time.nist.gov        iburst            # NIST round-robin (Boulder CO)
server utcnist.colorado.edu iburst            # U of Colorado Boulder (stratum 1)

# ── US NTP Pool — fallback only ───────────────────────────────────────────────
pool us.pool.ntp.org        iburst

# ── Security ──────────────────────────────────────────────────────────────────
# No external systems can modify our time configuration
restrict default nomodify notrap nopeer noquery
restrict 127.0.0.1                              # Full access from localhost
restrict ::1                                    # Full access from IPv6 localhost
restrict source nomodify notrap noquery         # Allow time sync from servers above

# ── Files ─────────────────────────────────────────────────────────────────────
driftfile /var/lib/ntp/drift
logfile   /var/log/ntp.log
